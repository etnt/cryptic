[project]
name = "cryptic-mcp-server"
version = "0.1.0"
description = "MCP server for administering the Cryptic messaging system"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cryptic-mcp-server = "cryptic_mcp_server:main"
