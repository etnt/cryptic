# Docker Compose configuration for Cryptic Server
version: "3.8"

services:
  cryptic-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cryptic-server:latest
    container_name: cryptic-server

    # Port mapping
    ports:
      - "8443:8443"

    # Environment variables (override Dockerfile defaults if needed)
    environment:
      - CRYPTIC_SERVER_HOST=0.0.0.0
      - CRYPTIC_SERVER_PORT=8443
      - CRYPTIC_SERVER_CERT=/opt/cryptic/certs/server.crt
      - CRYPTIC_SERVER_KEY=/opt/cryptic/certs/server.key
      - CRYPTIC_CA_CERT=/opt/cryptic/certs/ca.crt
      - CRYPTIC_CA_DB_FILE=/opt/cryptic/data/ca/cryptic_ca.db
      - CRYPTIC_EVENT_HANDLERS=cryptic_file_logger
      # Optional: Enable debug logging (set to "true" for verbose output)
      - CRYPTIC_DEBUG=true

    # Volume mounts for certificates and persistent data
    volumes:
      # Mount certificates from priv/ssl (generated by scripts/generate-mtls-certs.sh)
      - ./priv/ssl/server.crt:/opt/cryptic/certs/server.crt:ro
      - ./priv/ssl/server.key:/opt/cryptic/certs/server.key:ro
      - ./priv/ssl/ca.crt:/opt/cryptic/certs/ca.crt:ro
      
      # Mount CA cert and key to release priv directory for certificate issuance
      - ./priv/ssl/ca.crt:/opt/cryptic/lib/cryptic-1.0.0/priv/ssl/ca.crt:ro
      - ./priv/ssl/ca.key:/opt/cryptic/lib/cryptic-1.0.0/priv/ssl/ca.key:ro

      # Optional: Bootstrap GPG fingerprints for pre-verified users
      # Uncomment and create the directory if using bootstrap
      # - ./priv/ca/bootstrap:/opt/cryptic/lib/cryptic-1.0.0/priv/ca/bootstrap:ro

      # Persistent data volumes (logs and CA database)
      - cryptic-logs:/opt/cryptic/logs
      - cryptic-ca-data:/opt/cryptic/data/ca
      - cryptic-data:/opt/cryptic/data

    # Restart policy
    restart: unless-stopped

    # Network configuration
    networks:
      - cryptic-network

    # Health check
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8443"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Cryptic TUI Client (interactive terminal UI)
  # NOTE: Requires cryptic-tui repository as sibling directory during build
  # See QUICKSTART-DOCKER-TUI.md for setup instructions
  cryptic-tui:
    build:
      context: ..  # Parent directory to access both cryptic/ and cryptic-tui/
      dockerfile: cryptic/Dockerfile.tui
    image: cryptic-tui:latest
    container_name: cryptic-tui
    
    # Interactive mode with TTY
    stdin_open: true
    tty: true
    
    # Environment variables (map to bin/cryptic script options)
    environment:
      # Username for authentication (required)
      # Set via TUI_USERNAME environment variable when running
      - CRYPTIC_USERNAME=${TUI_USERNAME:-alice}
      
      # Server connection details (can be overridden)
      # Default to localhost which maps to host machine via extra_hosts
      # Override with CRYPTIC_SERVER_HOST=cryptic-server for Docker server
      # or CRYPTIC_SERVER_HOST=relay.example.com for remote server
      - CRYPTIC_SERVER_HOST=${CRYPTIC_SERVER_HOST:-localhost}
      - CRYPTIC_SERVER_PORT=${CRYPTIC_SERVER_PORT:-8443}
      
      # Erlang node configuration
      - CRYPTIC_NODE_NAME=${CRYPTIC_NODE_NAME:-localhost}
      
      # Enable encrypted message storage (optional)
      - CRYPTIC_ENABLE_DB=${CRYPTIC_ENABLE_DB:-false}
      
      # TUI mode flags (handled by bin/cryptic --tui)
      - CRYPTIC_TUI_MODE=true
      - CRYPTIC_INTERACTIVE=false
      
      # Terminal configuration
      - TERM=xterm-256color
    
    # Volume mounts for cryptographic keys, database, and logs
    volumes:
      # CRITICAL: Mount entire .cryptic directory for persistent storage
      # This directory contains ALL user data:
      # - certificates/          mTLS client certificates
      # - keys.encrypted         Encrypted X3DH identity keys
      # - sessions/*.session     Double Ratchet session states (encrypted)
      # - cryptic_chat.db        SQLite message history (if --enable-db)
      # - logs/                  Application logs
      #
      # MUST be read-write because:
      # - cryptic_lib saves/loads encrypted identity keys
      # - cryptic_engine updates session states after each message
      # - cryptic_chat_storage writes to SQLite database
      # - Application writes log files
      - ${HOME}/.cryptic:/home/cryptic/.cryptic
      
      # Mount Erlang cookie (read-only is fine, never modified)
      - ${HOME}/.erlang.cookie:/home/cryptic/.erlang.cookie:ro
    
    # NOTE: No depends_on - client can connect to any server (local or remote)
    # If connecting to local cryptic-server, start it separately first
    
    # Network configuration (only needed if connecting to local server)
    networks:
      - cryptic-network
    
    # Map localhost in container to host machine (for Mac/Windows Docker Desktop)
    # This allows container to connect to server running on host's localhost:8443
    extra_hosts:
      - "localhost:host-gateway"
    
    # Don't auto-restart (this is an interactive client)
    restart: "no"

# Named volumes for persistent data
volumes:
  cryptic-logs:
    driver: local
  cryptic-ca-data:
    driver: local
  cryptic-data:
    driver: local
  # Note: cryptic-tui-logs removed - using host ~/.cryptic mount instead

# Network configuration
networks:
  cryptic-network:
    driver: bridge
