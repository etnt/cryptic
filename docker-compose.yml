# Docker Compose configuration for Cryptic Server
version: "3.8"

services:
  cryptic-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cryptic-server:latest
    container_name: cryptic-server

    # Port mapping
    ports:
      - "8443:8443"

    # Environment variables
    environment:
      - CRYPTIC_SERVER_HOST=0.0.0.0
      - CRYPTIC_SERVER_PORT=8443
      - CRYPTIC_SERVER_CERT=/opt/cryptic/certs/server.crt
      - CRYPTIC_SERVER_KEY=/opt/cryptic/certs/server.key
      - CRYPTIC_CA_CERT=/opt/cryptic/certs/ca.crt
      - CRYPTIC_EVENT_HANDLERS=cryptic_file_logger

    # Volume mounts for certificates and persistent data
    volumes:
      # Mount your CA directory with certificates
      - ./CA/certs/server.crt:/opt/cryptic/certs/server.crt:ro
      - ./CA/private/server.key:/opt/cryptic/certs/server.key:ro
      - ./CA/certs/ca.crt:/opt/cryptic/certs/ca.crt:ro

      # Persistent data volumes
      - cryptic-logs:/opt/cryptic/logs
      - cryptic-data:/opt/cryptic/data

    # Restart policy
    restart: unless-stopped

    # Network configuration
    networks:
      - cryptic-network

    # Health check
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8443"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Named volumes for persistent data
volumes:
  cryptic-logs:
    driver: local
  cryptic-data:
    driver: local

# Network configuration
networks:
  cryptic-network:
    driver: bridge
